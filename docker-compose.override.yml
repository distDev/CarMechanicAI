services:
  app:
    container_name: carai-backend-app-dev

    working_dir: /app

    command: npm run dev

    env_file:
      - .env.development

    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: true

volumes:
  app_node_modules:
